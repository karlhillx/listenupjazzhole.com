# Merge into /home/karl/data/nginx/default.conf on the Hetzner host.
# Also add the apex + www names to the shared listen 80 server_name list.

server {
    listen 443 ssl;
    server_tokens off;
    server_name www.listenupjazzhole.com;
    ssl_certificate /etc/letsencrypt/live/listenupjazzhole.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listenupjazzhole.com/privkey.pem;
    return 301 https://listenupjazzhole.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    server_name listenupjazzhole.com;
    ssl_certificate /etc/letsencrypt/live/listenupjazzhole.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listenupjazzhole.com/privkey.pem;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/listenupjazzhole.com/public;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/manifest+json
        application/xml application/xml+rss application/atom+xml application/rss+xml
        image/svg+xml font/woff2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /build/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass listenupjazzhole:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 8 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
