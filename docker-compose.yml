services:
  listenupjazzhole:
    image: listenupjazzhole
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: karl-listenupjazzhole-1
    volumes:
      - .:/var/www
      - /var/www/node_modules
      - /var/www/vendor
    networks:
      - karlhill
    restart: unless-stopped

networks:
  karlhill:
    external: true
